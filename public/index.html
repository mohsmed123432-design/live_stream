<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Video Call</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #222; color: white; padding: 20px; }
        .video-container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        video { width: 45%; max-width: 600px; border-radius: 10px; background: #000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transform: scaleX(-1); }
        button { padding: 10px 20px; font-size: 18px; cursor: pointer; margin-top: 20px; background: #28a745; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>Live Video Chat</h2>
    <button id="callButton">Start Call</button>
    <div class="video-container">
        <video id="localVideo" autoplay muted playsinline></video>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
